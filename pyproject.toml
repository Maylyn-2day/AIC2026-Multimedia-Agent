[project]
name = "aic2026-multimedia-agent"
version = "0.1.0"
description = "Intelligent Multimedia Retrieval & Reasoning System for AIC 2026"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Team Multimedia Agent" },
]
keywords = ["multimedia", "retrieval", "aic2026", "rag", "vision-language"]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["backend", "frontend", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["backend", "frontend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests requiring live DB connections",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

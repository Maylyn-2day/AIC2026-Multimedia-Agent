# ============================================================
# AIC2026-Multimedia-Agent — Docker Compose
# ============================================================
# Usage:
#   docker compose up -d              # Start all infrastructure
#   docker compose up -d qdrant es    # Start DBs only
#   docker compose down -v            # Teardown with volumes
# ============================================================

services:
  # ── Qdrant Vector Database ──────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.12.1
    container_name: aic2026-qdrant
    ports:
      - "${QDRANT_PORT:-6333}:6333"   # REST API
      - "${QDRANT_GRPC_PORT:-6334}:6334"  # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── Elasticsearch (Sparse Search) ───────────────────────────
  es:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: aic2026-elasticsearch
    ports:
      - "${ES_PORT:-9200}:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI Backend ─────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: aic2026-backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - .env
    volumes:
      - ./backend:/app/backend
      - ./configs:/app/configs
      - ./data:/app/data
    depends_on:
      qdrant:
        condition: service_healthy
      es:
        condition: service_healthy
    restart: unless-stopped
    # Uncomment below for GPU passthrough
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # ── Streamlit Frontend ──────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: aic2026-frontend
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - ./frontend:/app/frontend
      - ./data/mock:/app/data/mock
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  qdrant_data:
    driver: local
  es_data:
    driver: local
